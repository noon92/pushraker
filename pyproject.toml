[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pushraker"
version = "0.3.2"
description = "Push notifications for Klipper printers: a Moonraker component with pictures, sent through Apprise (ntfy, Pushover, Telegram, Discord, webhooks, email)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "noon92"}]
keywords = ["klipper", "moonraker", "notifications", "ntfy", "apprise", "3d-printing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "apprise>=1.9",
    "requests",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/noon92/pushraker"
Issues = "https://github.com/noon92/pushraker/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pushraker = ["web/*", "klipper/*"]
