[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pushraker"
version = "0.4.2"
description = "Push notifications for Klipper printers: a Moonraker component with pictures, sent through Apprise (ntfy, Pushover, Telegram, Discord, webhooks, email)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "noon92"}]
keywords = ["klipper", "moonraker", "notifications", "ntfy", "apprise", "3d-printing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
]
# The lowest versions checked (tests/check_deps.py): those of the Creality
# Hi's stock Moonraker (apprise 1.2.0, Pillow 8.2.0, Jinja2 3.1.2), which
# pushraker must not upgrade
dependencies = [
    "apprise>=1.2",
    "requests",
    "Pillow>=8.2",
    "jinja2>=3.0",
]

[project.urls]
Homepage = "https://github.com/noon92/pushraker"
Issues = "https://github.com/noon92/pushraker/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pushraker = ["web/*", "klipper/*", "templates/*"]
