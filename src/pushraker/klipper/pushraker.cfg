# pushraker: the Klipper side. Include this file from printer.cfg (the
# installer does it) and call the hooks from your print-end and cancel
# macros, before they park:
#
#   _PRINT_END_NTFY       at the start of PRINT_END
#   _CANCEL_PRINT_NTFY    at the start of CANCEL_PRINT
#
# They lift the toolhead a little (so the camera snapshot shows the part,
# not the nozzle) and report the event to the Moonraker component, which
# takes the snapshot before the printer parks. What they do is set by the
# component from the notification settings (SET_GCODE_VARIABLE on
# _NTFY_HOOKS): 0 nothing, 1 report, 2 lift and report. A hook never fails:
# the print-end macro (heaters off, motors off) must always run.
#
# On the Snapmaker U1 extended firmware the stock PRINT_END and
# CANCEL_PRINT already call these hooks.

[gcode_macro _NTFY_HOOKS]
description: What the pushraker print hooks do (set by the component)
variable_complete: 0
variable_cancelled: 0
variable_fault: 0
variable_lift_mm: 15
# The lift keeps Z + lift at or below this (the Snapmaker U1's own
# print-end macros raise Z by 5 mm below 265 mm; stay inside that)
variable_lift_ceiling: 265
gcode:
    RESPOND MSG="pushraker hooks: complete={printer['gcode_macro _NTFY_HOOKS'].complete} cancelled={printer['gcode_macro _NTFY_HOOKS'].cancelled} fault={printer['gcode_macro _NTFY_HOOKS'].fault}"

[gcode_macro _NTFY_LIFT]
description: Lift the toolhead a little before the print-end snapshot
gcode:
    {% set hooks = printer["gcode_macro _NTFY_HOOKS"] %}
    {% set th = printer.toolhead %}
    {% set z = printer.gcode_move.gcode_position.z %}
    {% set lift = [hooks.lift_mm, hooks.lift_ceiling - z]|min %}
    {% if "z" in th.homed_axes and lift > 0 %}
    SAVE_GCODE_STATE NAME=ntfy_lift
    # Z only: retraction is the slicer's and the printer's own
    G91
    G1 Z{lift} F1800
    RESTORE_GCODE_STATE NAME=ntfy_lift
    {% endif %}
    # Klipper reads G-code ahead of the motion: wait until the toolhead
    # is really up, so the snapshot isn't taken with the nozzle on the part
    M400

[gcode_macro _NTFY_SEND]
description: Report a print hook event to the push_notifications component
gcode:
    {action_call_remote_method("push_notification", event=params.EVENT)}

[gcode_macro _PRINT_END_NTFY]
description: Notify print complete (call at the start of PRINT_END)
gcode:
    {% set mode = printer["gcode_macro _NTFY_HOOKS"].complete|int %}
    {% if mode > 0 and printer.print_stats.state == "printing" %}
    {% if mode > 1 %}
    _NTFY_LIFT
    {% endif %}
    _NTFY_SEND EVENT=complete
    {% endif %}

[gcode_macro _CANCEL_PRINT_NTFY]
description: Notify print cancelled (call at the start of CANCEL_PRINT)
gcode:
    {% set hooks = printer["gcode_macro _NTFY_HOOKS"] %}
    {% set ps = printer.print_stats %}
    {% set fault = ps.exception is defined and ps.exception and ps.exception.code is defined %}
    {% set mode = (hooks.fault if fault else hooks.cancelled)|int %}
    {% if mode > 0 and ps.state in ["printing", "paused"] %}
    {% if mode > 1 %}
    _NTFY_LIFT
    {% endif %}
    _NTFY_SEND EVENT=cancelled
    {% endif %}
