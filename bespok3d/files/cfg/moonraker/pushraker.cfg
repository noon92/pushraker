# pushraker, installed by Bespok3d. Notification settings are on the
# settings page (/server/pushraker/page) and in pushraker.conf beside
# moonraker.conf, not here.
# name is only the first default: the settings page sets the printer's name.
# error_index_url is the Snapmaker U1's, until pushraker's U1 profile
# carries it itself (it is only used for the U1's error codes).
[pushraker]
name: Printer
error_index_url: https://wiki.snapmaker.com/en/snapmaker_u1/troubleshooting/u1_error_codes
